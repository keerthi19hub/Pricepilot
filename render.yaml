services:
  - type: web
    name: pricepilot
    env: python
    plan: free
    region: oregon
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt && python -m backend.app.seed.seed_data"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: "sqlite:///./pricepilot.db"
